@if (loading()) {
  <div class="loading-container">
    <div class="spinner"></div>
    <p>Cargando portafolio...</p>
  </div>
} @else if (error()) {
  <div class="error-container">
    <p>{{ error() }}</p>
  </div>
} @else if (portfolioData()) {
  <app-hero [data]="portfolioData()!.hero" />
  <app-about [data]="portfolioData()!.about" />
  <app-skills [data]="portfolioData()!.skills" />
  <app-projects [data]="portfolioData()!.projects" />
  <app-contact [data]="portfolioData()!.contact" />
}
