<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="nav-logo">
      <span class="logo-text">Fabian</span>
      <span class="logo-accent">Rodas</span>
    </a>
    
    <button 
      class="menu-toggle" 
      (click)="toggleMenu()"
      [attr.aria-label]="isMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      [class.active]="isMenuOpen()">
      <span></span>
      <span></span>
      <span></span>
    </button>
    
    <ul class="nav-menu" [class.active]="isMenuOpen()">
      <li class="nav-item">
        <a 
          routerLink="/" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: true}"
          class="nav-link"
          (click)="closeMenu()">
          Inicio
        </a>
      </li>
      <li class="nav-item">
        <a 
          routerLink="/about" 
          routerLinkActive="active"
          class="nav-link"
          (click)="closeMenu()">
          Sobre Mí
        </a>
      </li>
      <li class="nav-item">
        <a 
          routerLink="/projects" 
          routerLinkActive="active"
          class="nav-link"
          (click)="closeMenu()">
          Proyectos
        </a>
      </li>
      <li class="nav-item">
        <a 
          routerLink="/contact" 
          routerLinkActive="active"
          class="nav-link"
          (click)="closeMenu()">
          Contacto
        </a>
      </li>
    </ul>
  </div>
</nav>
