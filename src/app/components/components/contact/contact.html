<section class="contact-section" id="contact">
  <div class="container">
    <h2 class="section-title">{{ data().title }}</h2>
    <p class="section-subtitle">{{ data().subtitle }}</p>
    
    <div class="contact-content">
      <p class="contact-description">{{ data().description }}</p>
      
      <div class="contact-cards-wrapper">
        <div class="contact-row contact-row-top">
          <a [href]="'mailto:' + data().email" class="contact-card">
            <div class="contact-icon">
              <i class="fa-solid fa-envelope"></i>
            </div>
            <h3>Gmail</h3>
            <p>{{ data().email }}</p>
          </a>
          
          <a [href]="'tel:' + data().phone" class="contact-card">
            <div class="contact-icon">
              <i class="fa-solid fa-phone"></i>
            </div>
            <h3>Teléfono</h3>
            <p>{{ data().phone }}</p>
          </a>
          
          <div class="contact-card location-card">
            <div class="contact-icon">
              <i class="fa-solid fa-location-dot"></i>
            </div>
            <h3>Ubicación</h3>
            <p>{{ data().location }}</p>
          </div>
        </div>
        
        <div class="contact-row contact-row-bottom">
          <a href="https://github.com/Fabianrodas" target="_blank" class="contact-card">
            <div class="contact-icon">
              <i class="fa-brands fa-github"></i>
            </div>
            <h3>GitHub</h3>
            <p>@Fabianrodas</p>
          </a>
          
          <a href="https://www.linkedin.com/in/fabianrodas/" target="_blank" class="contact-card">
            <div class="contact-icon">
              <i class="fa-brands fa-linkedin"></i>
            </div>
            <h3>LinkedIn</h3>
            <p>Fabian Rodas</p>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
