<section class="contact-section" id="contact">
  <div class="container">
    <h2 class="section-title">{{ data().title }}</h2>
    <p class="section-subtitle">{{ data().subtitle }}</p>
    
    <div class="contact-content">
      <div class="contact-info">
        <p class="contact-description">{{ data().description }}</p>
        
        <div class="contact-details">
          <div class="contact-item">
            <div class="contact-icon">📧</div>
            <div>
              <h4>Email</h4>
              <a [href]="'mailto:' + data().email">{{ data().email }}</a>
            </div>
          </div>
          
          <div class="contact-item">
            <div class="contact-icon">📱</div>
            <div>
              <h4>Teléfono</h4>
              <a [href]="'tel:' + data().phone">{{ data().phone }}</a>
            </div>
          </div>
          
          <div class="contact-item">
            <div class="contact-icon">📍</div>
            <div>
              <h4>Ubicación</h4>
              <p>{{ data().location }}</p>
            </div>
          </div>
        </div>
        
        <div class="social-links">
          @for (social of data().social; track social.platform) {
            <a [href]="social.url" target="_blank" class="social-link" [title]="social.platform">
              {{ social.platform }}
            </a>
          }
        </div>
      </div>
      
      <div class="contact-form-wrapper">
        <form class="contact-form" (ngSubmit)="submitForm()">
          <div class="form-group">
            <input 
              type="text" 
              [(ngModel)]="formData().name"
              name="name"
              [placeholder]="data().form.namePlaceholder"
              required
              class="form-control">
          </div>
          
          <div class="form-group">
            <input 
              type="email" 
              [(ngModel)]="formData().email"
              name="email"
              [placeholder]="data().form.emailPlaceholder"
              required
              class="form-control">
          </div>
          
          <div class="form-group">
            <textarea 
              [(ngModel)]="formData().message"
              name="message"
              [placeholder]="data().form.messagePlaceholder"
              required
              rows="5"
              class="form-control"></textarea>
          </div>
          
          <button type="submit" class="submit-btn">
            {{ data().form.submitButton }}
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
